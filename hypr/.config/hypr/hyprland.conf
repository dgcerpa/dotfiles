# ─────────────────────────────────────────────────────────────
# HYPRLAND · CONFIG MÍNIMA (Fase 1.3)
# Solo lo necesario para arrancar y poder salir de la sesión
# ─────────────────────────────────────────────────────────────

# Monitor: auto-detecta el monitor del laptop con resolución preferida
monitor = , preferred, auto, 1

# Variable para el modificador
$mod = SUPER

# Apps por defecto
$terminal = kitty
$fileManager = dolphin

# ─── Autostart ───────────────────────────────────────────────
# Polkit agent (para diálogos de sudo gráficos)
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = blueman-applet
exec-once = nm-applet
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets

# ─── Variables de entorno ────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ─── General ─────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(3b82f6ff) rgba(38bdf8ff) 45deg
    col.inactive_border = rgba(0a1430aa)
    layout = dwindle
}

# ─── Decoraciones (mínimas por ahora, refinamos en Fase 4) ──
decoration {
    rounding = 6
    blur {
        enabled = false
    }
}

# ─── Animaciones (off por ahora, validamos que arranca) ─────
animations {
    enabled = false
}

# ─── Layout ──────────────────────────────────────────────────
dwindle {
    preserve_split = true
}

# ─── Input ───────────────────────────────────────────────────
input {
    kb_layout = latam
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# ─── ATAJOS MÍNIMOS ─────────────────────────────────────────
# Si algo falla, con Mod+Q tenés terminal y con Mod+M salís

bind = $mod, SPACE, exec, wofi --show drun
bind = , ESCAPE, exec, pkill wofi

bind = $mod, Q, exec, $terminal
bind = $mod, X, killactive
bind = $mod, M, exit
bind = $mod, E, exec, $fileManager
bind = $mod, T, togglefloating
bind = $mod, F, fullscreen

# Extras
bind = $mod, Z, exec, zen-browser
bind = $mod, C, exec, claude-desktop
bind = $mod, R, exec, rstudio

bind = $mod, S, exec, spotify
bind = $mod, V, exec, code
bind = $mod, A, exec, obsidian
bind = $mod, G, exec, github-desktop


# Mover foco con teclas de flecha
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Mover ventana de lugar
bind = $mod SHIFT, left, 	movewindow, l
bind = $mod SHIFT, right, 	movewindow, r
bind = $mod SHIFT, up, 		movewindow, u
bind = $mod SHIFT, down, 	movewindow, d

# Workspaces (1-9)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Mover ventana al workspace N
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mover ventanas con mouse (mantener mod + click)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow


# ─── Teclas F1/F2/F3 como audio (workaround Fn Lock) ────────
bindl  = , F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , F3, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_SOURCE@ toggle

# Brillo de pantalla (Fn+F6 sube, Fn+F5 baja)
bindel = , F6, exec, brightnessctl --device 'amdgpu_bl1' set +10%
bindel = , F5, exec, brightnessctl --device 'amdgpu_bl1' set 10%-

# Luz del teclado (Fn+F8 cicla 0→1→2→0)
bindl = , F8, exec, c=$(brightnessctl --device 'tpacpi::kbd_backlight' get); if [ "$c" -ge 2 ]; then brightnessctl --device 'tpacpi::kbd_backlight' set 0; else brightnessctl --device 'tpacpi::kbd_backlight' set +1; fi

# Control de reproducción (Fn+F10 anterior, Fn+F11 play/pausa, Fn+F12 siguiente)
bindl = , F10, exec, playerctl previous
bindl = , F11, exec, playerctl play-pause
bindl = , F12, exec, playerctl next


# ─── Screenshots ────────────────────────────────────────────
# SUPER+SHIFT+S: región al portapapeles (estilo Windows)
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/Imágenes/Capturas\ de\ pantalla/$(date +'%Y-%m-%d_%H-%M-%S')_region.png | wl-copy

# Print (Fn+F9): pantalla completa a archivo + portapapeles
bind = , Print, exec, grim ~/Imágenes/Capturas\ de\ pantalla/$(date +'%Y-%m-%d_%H-%M-%S').png && grim - | wl-copy
